name: Daily Judicial Foreclosure Ingestion Pipeline

on:
  schedule:
    # Runs at 13:00 UTC (7:00 AM Costa Rica Time) Monday through Friday
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  ingest:
    name: Scrape, Extract & Ingest Boletín Judicial Auctions
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Gemini Ingestion Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python scraper/main.py
