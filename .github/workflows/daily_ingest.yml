name: Daily Foreclosure Ingestion & Immediate Verification Pipeline

on:
  schedule:
    # 13:15 UTC = 7:15 AM Costa Rica Time (UTC-6) [Primary Check]
    - cron: '15 13 * * *'
    # 14:00 UTC = 8:00 AM Costa Rica Time (UTC-6) [Fallback Retry if 7:15 AM had no publication]
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  scrape_and_verify:
    name: Scrape Daily Publication, Filter Expired, Ingest & Immediately Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ingestion & Verification Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          npm install

      - name: Run Scraper, Ingest & Immediate Cadastral Verification
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scraper/main.py --retry-if-empty

      - name: Run Standalone Auction Call Progression Tracker (PostgreSQL RPC)
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          python scraper/auction_tracker.py --sync-once

      - name: Upload Debug Payload Log (If Generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-log
          path: scraper/debug_raw_response.log
          if-no-files-found: ignore

