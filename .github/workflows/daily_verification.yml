name: Daily Post-Scan Verification & Cadastral Mapping Engine (9:30 AM CR Time)

on:
  schedule:
    # 15:30 UTC = 9:30 AM Costa Rica Time (UTC-6), Daily
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  verify_and_map_new_listings:
    name: Verify Titles & Geocode Newly Added Listings with SNIT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Post-Scan Verification & Cadastral Mapping Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npx tsx scripts/verify_and_map.ts --today-only
